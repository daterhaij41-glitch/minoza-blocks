name: Build Minoza Blocks APK 0.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Minoza-Blocks-Android-v0.3.0.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify and extract project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Minoza-Blocks-Android-v0.3.0.zip"
          test -s "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          unzip -oq "$ARCHIVE" -d .
          test -s app/build.gradle
          test -s app/src/main/java/com/minoza/game/GameView.java
          grep -Fq "versionName '0.3.0'" app/build.gradle
          echo "MINOZA BLOCKS source 0.3.0 verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minoza-Blocks-APK-0.3.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
