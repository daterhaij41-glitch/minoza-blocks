name: Build Minoza Blocks APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify and extract project
        run: |
          set -e
          ARCHIVE="Minoza-Blocks-Android-v0.2.0.zip"
          test -s "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          unzip -oq "$ARCHIVE" -d .
          test -s app/build.gradle
          test -s app/src/main/java/com/minoza/game/GameView.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size:"
          stat -c%s "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minoza-Blocks-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
